id: SX-AUTH-002
title: Repeated Windows logon failures
description: Five or more failed Windows logons (event 4625) from one source IP within five minutes.
version: 1
enabled: true
severity: medium
type: threshold
tags: [authentication, brute-force]
mitre:
  - technique_id: T1110
match:
  all:
    - {field: event.dataset, op: eq, value: windows.security}
    - {field: event.action, op: eq, value: logon_failed}
threshold:
  count: 5
  window_seconds: 300
group_by: [source.ip]
false_positives:
  - Service accounts with expired credentials.
  - Users mistyping passwords after a rotation.
next_checks:
  - Check for a successful 4624 from the same source shortly after.
  - Review logon type and targeted accounts.
references: [https://attack.mitre.org/techniques/T1110/]
