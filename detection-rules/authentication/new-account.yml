id: SX-PRIV-001
title: New local account created
description: A user account was created (Windows 4720 or Linux useradd).
version: 1
enabled: true
severity: high
type: match
tags: [privilege-escalation, persistence, iam]
mitre:
  - technique_id: T1136.001
match:
  all:
    - {field: event.action, op: eq, value: user_created}
group_by: [host.name]
dedupe_window_seconds: 600
false_positives:
  - Planned provisioning of lab users.
next_checks:
  - Identify who created the account and whether a change ticket exists.
  - Check whether the new account was added to a privileged group.
references: [https://attack.mitre.org/techniques/T1136/001/]
