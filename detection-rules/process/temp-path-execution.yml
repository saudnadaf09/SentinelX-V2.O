id: SX-EXEC-003
title: Executable launched from a user-writable temp path
description: A process started from a Temp, Public or Windows\Temp directory.
version: 1
enabled: true
severity: medium
type: match
tags: [execution, defense-evasion]
mitre:
  - technique_id: T1204
  - technique_id: T1036
match:
  all:
    - {field: event.action, op: eq, value: process_creation}
    - {field: process.executable, op: regex, value: '\\(appdata\\local\\temp|windows\\temp|users\\public)\\'}
exclude:
  - {field: process.parent.name, op: eq, value: lab-automation.exe}
group_by: [host.name, user.name]
dedupe_window_seconds: 300
false_positives:
  - Installers and updaters that unpack to Temp.
next_checks:
  - Check the file signature and hash reputation (not available in this lab build).
  - Find how the file arrived (download, email attachment, other process).
references: [https://attack.mitre.org/techniques/T1204/]
