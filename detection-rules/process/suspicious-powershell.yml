id: SX-EXEC-001
title: Suspicious PowerShell command line
description: PowerShell started with encoded, hidden-window, execution-policy-bypass or download-cradle patterns.
version: 1
enabled: true
severity: high
type: match
tags: [execution, defense-evasion, powershell]
mitre:
  - technique_id: T1059.001
  - technique_id: T1027
match:
  all:
    - {field: event.action, op: eq, value: process_creation}
    - {field: process.name, op: in, value: [powershell.exe, pwsh.exe]}
    - any:
        - {field: process.command_line, op: contains_any, value: ["-encodedcommand", "-enc ", "-windowstyle hidden", "-w hidden", "-executionpolicy bypass", "-ep bypass", "downloadstring", "downloadfile", "invoke-expression", "iex ", "iex(", "frombase64string"]}
exclude:
  all:
    - {field: process.parent.name, op: eq, value: lab-automation.exe}
group_by: [host.name, user.name]
dedupe_window_seconds: 300
false_positives:
  - Lab automation or software deployment tools that use encoded commands (add an exclusion).
  - Admin scripts that deliberately use -ExecutionPolicy Bypass.
next_checks:
  - Decode any base64 payload in a safe, isolated environment.
  - Inspect the parent process and what the user did just before.
  - Look for outbound network connections from the same process.
references: [https://attack.mitre.org/techniques/T1059/001/]
