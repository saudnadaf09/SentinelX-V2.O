id: SX-PERSIST-001
title: Scheduled task or service created from the command line
description: schtasks /create, sc create, or PowerShell scheduled-task registration.
version: 1
enabled: true
severity: high
type: match
tags: [persistence, execution]
mitre:
  - technique_id: T1053.005
  - technique_id: T1543.003
match:
  all:
    - {field: event.action, op: eq, value: process_creation}
    - any:
        - {field: process.command_line, op: contains_any, value: ["schtasks /create", "schtasks.exe /create", register-scheduledtask, new-scheduledtask]}
        - {field: process.command_line, op: regex, value: '(?:^|[\s\\"])sc(?:\.exe)?\s+create\s'}
group_by: [host.name, user.name]
dedupe_window_seconds: 300
false_positives:
  - Software installers registering update tasks or services.
next_checks:
  - Inspect the task/service action and binary path.
  - Check whether the binary lives in a user-writable location.
references: [https://attack.mitre.org/techniques/T1053/005/]
